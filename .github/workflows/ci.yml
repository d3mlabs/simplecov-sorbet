# CI runs what a developer runs: `dev up`, then the check verbs dev.yml
# defines — `dev style`, `dev typecheck`, `dev test` — under the Ruby
# dependencies.rb locks. Nothing in those jobs invokes the toolchain
# directly, so the first dev command's manifest/lock staleness guard runs
# on every PR. GH_TOKEN is the credential the action's toolchain check
# requires; the job's own token reaches every pin this public tap serves.
#
# `compat` is the one job outside dev: a published gem supporting every
# Ruby >= 3.3 (the gemspec) runs its suite on the Rubies it does not lock,
# through setup-ruby. The gate is `test`; `compat` answers a different
# question — does the gem still work on the older Rubies it promises.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: d3mlabs/dev/up@main
      - run: dev style

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: d3mlabs/dev/up@main
      - run: dev typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: d3mlabs/dev/up@main
      - run: dev test
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/coverage.json
          fail_ci_if_error: false

  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test
