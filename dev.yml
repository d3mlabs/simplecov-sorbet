name: simplecov-sorbet
commands:
  up:
    desc: Install gems
    run: bundle install
  test:
    desc: Run this repo's tests
    run: bundle exec rake test
  style:
    desc: Run RuboCop
    run: bundle exec rubocop
  typecheck:
    desc: Run Sorbet
    run: bundle exec srb tc
  test-ruby:
    desc: Run the suite under a Ruby the gemspec promises but the lock does not cover (Homebrew ruby@<minor>)
    run: ./bin/test-ruby.sh
  release:
    desc: Release a new version (bump, tag, push; CI publishes to rubygems.org)
    run: ./bin/release.rb
