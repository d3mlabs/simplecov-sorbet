# The org tier: rubocop-shopify + rubocop-sorbet, every file carries a
# `typed:` sigil, no endless defs, RSpock test-dialect exclusions.
inherit_gem:
  rubocop-d3mlabs: rubocop.yml

inherit_mode:
  merge:
    - Exclude

AllCops:
  Exclude:
    # Polyglot sh/ruby bootstrap scripts (#!/bin/sh preamble re-execing via
    # `ruby -x`); not parseable as plain Ruby.
    - bin/**/*
